# Milestone 7: on every push, build the image and prove a Job runs (and fails) in Kubernetes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the benchmark directly
        run: RESULTS_DIR=$(mktemp -d) python job/run_benchmark.py

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: paperlab
          config: cluster/kind-config.yaml

      - name: Run a benchmark Job (must succeed)
        run: ./scripts/run-job.sh

      - name: Run a broken Job (must fail)
        run: |
          if BENCH_SIZE=oops ./scripts/run-job.sh; then
            echo "A job with bad input succeeded; failure detection is broken" >&2
            exit 1
          fi
          echo "Broken job failed as expected"
