# Milestone 3: run the benchmark image as a Kubernetes Job.
# scripts/run-job.sh fills ${RUN_ID} and ${BENCH_SIZE} with envsubst before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark
  labels:
    app: paperlab
spec:
  # Retry once (e.g. the pod was killed), then mark the Job failed so the alert fires.
  backoffLimit: 1
  # A job still running after 2 minutes is stuck (a normal run takes under a second).
  # Kubernetes stops it and marks the Job failed, so a hang becomes a failure alert
  # instead of a server running all night.
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: paperlab
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true       # refuse to start if the image would run as root
        runAsUser: 10001
      containers:
        - name: benchmark
          image: paperlab-job:dev   # loaded into kind by scripts/run-job.sh
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_ID
              value: "${RUN_ID}"
            - name: BENCH_SIZE
              value: "${BENCH_SIZE}"
            - name: RESULTS_DIR
              value: "/results"
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            # requests: what the scheduler reserves on a node for this pod.
            # limits: going over the CPU limit slows the pod down; going over the
            # memory limit kills it (OOMKilled) and the Job counts a failure.
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: results   # k8s/results-pvc.yaml
