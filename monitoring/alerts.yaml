# Milestone 6: alert rules. kube-state-metrics exposes kube_job_* metrics.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paperlab-alerts
  labels:
    release: monitoring   # TODO: must match the Helm release name you install
spec:
  groups:
    - name: paperlab
      rules:
        - alert: BenchmarkJobStuck
          # TODO: write a PromQL expression that is true when a paperlab Job
          # has been active longer than you expect (hint: kube_job_status_active,
          # kube_job_status_start_time).
          expr: vector(0) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Benchmark job running longer than expected"
        - alert: NodeIdle
          # TODO: true when a node's CPU use stays near zero while no job runs.
          expr: vector(0) > 1
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Node idle — nothing running"
