# Milestone 6: alert when a benchmark Job fails.
# kube-state-metrics exports kube_job_status_failed: the number of failed pods of a Job.
# A hung job also ends here: activeDeadlineSeconds in k8s/benchmark-job.yaml stops it
# and marks it failed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paperlab-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: paperlab
      rules:
        - alert: BenchmarkJobFailed
          expr: |
            sum by (namespace, job_name) (
              kube_job_status_failed{job_name=~"benchmark.*"}
            ) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Benchmark job {{ $labels.job_name }} failed"
            description: "Check it with: kubectl logs job/{{ $labels.job_name }}"
